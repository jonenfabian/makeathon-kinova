name: Laptop-Start
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt
      - name: Simulation prüfen
        run: python smoke.py
